<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="basicsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="130" r="100" fill="url(#basicsGrad)" opacity="0.1"/>
  
  <!-- Seedling icon -->
  <g transform="translate(200, 130)">
    <!-- Pot -->
    <path d="M-25,20 L25,20 L20,50 L-20,50 Z" fill="#764ba2" opacity="0.8"/>
    <!-- Stem -->
    <line x1="0" y1="20" x2="0" y2="-30" stroke="#667eea" stroke-width="4" stroke-linecap="round"/>
    <!-- Left leaf -->
    <ellipse cx="-10" cy="-10" rx="15" ry="8" fill="#28a745" transform="rotate(-30, -10, -10)"/>
    <!-- Right leaf -->
    <ellipse cx="10" cy="-20" rx="15" ry="8" fill="#28a745" transform="rotate(30, 10, -20)"/>
    <!-- Top leaf -->
    <ellipse cx="0" cy="-35" rx="12" ry="6" fill="#20c997" transform="rotate(0, 0, -35)"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="230" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="20" font-weight="700" fill="#333">Python Basics</text>
  <text x="200" y="255" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="14" fill="#888">للمبتدئين 🟢</text>
</svg>
