<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="oopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="130" r="100" fill="url(#oopGrad)" opacity="0.1"/>
  
  <!-- Cubes icon -->
  <g transform="translate(200, 130)">
    <!-- Cube 1 (big) -->
    <rect x="-25" y="-15" width="35" height="35" rx="4" fill="#f5576c" opacity="0.9"/>
    <rect x="-25" y="-15" width="8" height="35" rx="2" fill="#d63384" opacity="0.5"/>
    
    <!-- Cube 2 (small) -->
    <rect x="5" y="-5" width="25" height="25" rx="3" fill="#f093fb" opacity="0.9"/>
    <rect x="5" y="-5" width="6" height="25" rx="2" fill="#c44dff" opacity="0.5"/>
    
    <!-- Connecting line -->
    <line x1="10" y1="5" x2="-25" y2="-15" stroke="#f5576c" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
  </g>
  
  <text x="200" y="230" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="20" font-weight="700" fill="#333">Python OOP</text>
  <text x="200" y="255" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="14" fill="#888">متوسط 🟡</text>
</svg>
