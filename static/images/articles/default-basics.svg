<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <circle cx="650" cy="100" r="200" fill="rgba(255,255,255,0.05)"/>
  <circle cx="150" cy="300" r="150" fill="rgba(255,255,255,0.05)"/>
  
  <!-- Python Logo -->
  <g transform="translate(400, 180)">
    <text x="0" y="20" text-anchor="middle" font-family="monospace" font-size="80" font-weight="900" fill="rgba(255,255,255,0.9)">&lt;/&gt;</text>
  </g>
  
  <text x="400" y="280" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="28" font-weight="700" fill="white">Python Basics</text>
  <text x="400" y="320" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="16" fill="rgba(255,255,255,0.7)">أساسيات البرمجة من الصفر</text>
  
  <!-- Dots pattern -->
  <g fill="rgba(255,255,255,0.1)">
    <circle cx="50" cy="50" r="4"/><circle cx="150" cy="50" r="4"/><circle cx="250" cy="50" r="4"/>
    <circle cx="50" cy="150" r="4"/><circle cx="150" cy="150" r="4"/><circle cx="250" cy="150" r="4"/>
    <circle cx="550" cy="50" r="4"/><circle cx="650" cy="50" r="4"/><circle cx="750" cy="50" r="4"/>
  </g>
</svg>
