<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="advancedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="130" r="100" fill="url(#advancedGrad)" opacity="0.1"/>
  
  <!-- Rocket icon -->
  <g transform="translate(200, 130)">
    <!-- Rocket body -->
    <path d="M0,-35 L-12,15 L-8,20 L0,10 L8,20 L12,15 Z" fill="#4facfe"/>
    <!-- Window -->
    <circle cx="0" cy="-10" r="6" fill="white" opacity="0.9"/>
    <!-- Fins -->
    <path d="M-12,15 L-20,25 L-10,20 Z" fill="#00f2fe"/>
    <path d="M12,15 L20,25 L10,20 Z" fill="#00f2fe"/>
    <!-- Fire -->
    <path d="M-6,20 L0,35 L6,20 Z" fill="#ff6b6b" opacity="0.8"/>
    <!-- Stars -->
    <circle cx="30" cy="-40" r="2" fill="#ffd700"/>
    <circle cx="-35" cy="-20" r="1.5" fill="#ffd700"/>
    <circle cx="40" cy="10" r="1.5" fill="#ffd700"/>
  </g>
  
  <text x="200" y="230" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="20" font-weight="700" fill="#333">Python Advanced</text>
  <text x="200" y="255" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="14" fill="#888">متقدم 🔴</text>
</svg>
